[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitter"
version = "0.1.0"
description = "Git-like version control CLI tool"
requires-python = ">=3.10"

[project.scripts]
gitter = "gitter.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
